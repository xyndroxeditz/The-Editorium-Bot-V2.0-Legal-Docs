<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editorium Bot - Legal Documents</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            text-align: center;
            max-width: 600px;
            width: 90%;
        }
        h1 {
            color: #2c3e50;
            margin-bottom: 10px;
            font-size: 2.5em;
        }
        .subtitle {
            color: #7f8c8d;
            margin-bottom: 30px;
            font-size: 1.1em;
        }
        .document-links {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin: 30px 0;
        }
        .doc-link {
            display: block;
            padding: 20px;
            background: linear-gradient(135deg, #3498db 0%, #2980b9 100%);
            color: white;
            text-decoration: none;
            border-radius: 10px;
            font-size: 1.2em;
            font-weight: bold;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 15px rgba(52, 152, 219, 0.3);
        }
        .doc-link:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(52, 152, 219, 0.4);
        }
        .doc-link.privacy {
            background: linear-gradient(135deg, #e74c3c 0%, #c0392b 100%);
            box-shadow: 0 4px 15px rgba(231, 76, 60, 0.3);
        }
        .doc-link.privacy:hover {
            box-shadow: 0 6px 20px rgba(231, 76, 60, 0.4);
        }
        .footer {
            margin-top: 30px;
            color: #95a5a6;
            font-size: 0.9em;
        }
        .discord-link {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 24px;
            background: #5865f2;
            color: white;
            text-decoration: none;
            border-radius: 25px;
            font-weight: bold;
            transition: background 0.2s;
        }
        .discord-link:hover {
            background: #4752c4;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📋 Editorium Bot</h1>
        <p class="subtitle">Legal Documents & Terms of Service</p>

        <div class="document-links">
            <a href="/terms-of-service.html" class="doc-link">
                📄 Terms of Service
                <br><small>Rules for using our Discord bot</small>
            </a>

            <a href="/privacy-policy.html" class="doc-link privacy">
                🔒 Privacy Policy
                <br><small>How we protect your data</small>
            </a>
        </div>

        <a href="https://discord.gg/your-server" class="discord-link" target="_blank">
            🌟 Join Our Discord Server
        </a>

        <div class="footer">
            <p>Last updated: October 18, 2025</p>
            <p>Editorium Bot V2.0 - The most advanced Discord bot for editors</p>
        </div>
    </div>
</body>
</html>
